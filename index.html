<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사탄의 장난감</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cg fill="#2A2C33" stroke="#2A2C33" stroke-width="2.4" stroke-linejoin="round"%3E%3Cpath d="M11 31 L12.6 7.2 Q13.2 5.4 14.8 6.6 L30.5 19 Z"/%3E%3Cpath d="M53 31 L51.4 7.2 Q50.8 5.4 49.2 6.6 L33.5 19 Z"/%3E%3C/g%3E%3Cpath d="M15.2 25 L15.9 12.8 L25.2 20.2 Z M48.8 25 L48.1 12.8 L38.8 20.2 Z" fill="#4B4F5A"/%3E%3Cellipse cx="32" cy="37" rx="23.5" ry="19.5" fill="#2A2C33"/%3E%3Ccircle cx="22.5" cy="37" r="7" fill="#FFD45C"/%3E%3Ccircle cx="41.5" cy="37" r="7" fill="#FFD45C"/%3E%3Ccircle cx="22.8" cy="37.8" r="5.6" fill="#121317"/%3E%3Ccircle cx="41.8" cy="37.8" r="5.6" fill="#121317"/%3E%3Ccircle cx="20.6" cy="35.2" r="1.9" fill="#FFFFFF"/%3E%3Ccircle cx="39.6" cy="35.2" r="1.9" fill="#FFFFFF"/%3E%3Ccircle cx="24.8" cy="40.2" r=".9" fill="#FFFFFF"/%3E%3Ccircle cx="43.8" cy="40.2" r=".9" fill="#FFFFFF"/%3E%3Cellipse cx="14.5" cy="45.5" rx="3.2" ry="1.9" fill="#FF8FB0" opacity=".5"/%3E%3Cellipse cx="49.5" cy="45.5" rx="3.2" ry="1.9" fill="#FF8FB0" opacity=".5"/%3E%3C/svg%3E">
<meta name="description" content="사탄이 만든 작은 장난감들">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --dot:rgba(120,180,230,.18);
  --ink:#2E4153; --ink-soft:#7489A0; --line:rgba(46,65,83,.12);
  --card:#FFFFFF; --shadow:0 8px 24px rgba(60,120,180,.10), 0 1px 2px rgba(60,120,180,.08);
  --accent:#3E95DA; --accent-soft:#E6F2FC;
}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%; overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121A22; --dot:rgba(255,255,255,.05); --ink:#EAF2FA; --ink-soft:#9FB2C6; --line:rgba(234,242,250,.14); --card:#1D2833; --shadow:0 8px 24px rgba(0,0,0,.3); --accent-soft:rgba(255,255,255,.08)}
}
:root[data-theme="dark"]{--bg:#121A22; --dot:rgba(255,255,255,.05); --ink:#EAF2FA; --ink-soft:#9FB2C6; --line:rgba(234,242,250,.14); --card:#1D2833; --shadow:0 8px 24px rgba(0,0,0,.3); --accent-soft:rgba(255,255,255,.08)}
body{margin:0; min-height:100vh; background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.6px, transparent 1.9px), linear-gradient(180deg,#EEF7FE 0,var(--bg) 420px); background-size:26px 26px,100% 100%; background-repeat:repeat,no-repeat; color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; word-break:keep-all; overflow-wrap:break-word; letter-spacing:-.01em; font-size:16px; line-height:1.6; -webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background-image:radial-gradient(var(--dot) 1.6px, transparent 1.9px)}}
.wrap{max-width:880px; margin:0 auto; padding:28px 18px 48px}
header{margin-bottom:22px}
.logo{display:flex; align-items:center; gap:12px}
.logo svg{width:52px; height:52px; flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}}
:root[data-theme="dark"] .logo svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
h1{font-family:"Jua",sans-serif; font-weight:400; font-size:clamp(34px,9vw,52px); line-height:1.1; margin:0; letter-spacing:-.01em}
.lede{margin:10px 0 0; color:var(--ink-soft); font-size:15px}
.grid{display:grid; gap:16px; grid-template-columns:1fr}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.game{position:relative; display:flex; flex-direction:column; background:var(--card); border-radius:28px; box-shadow:var(--shadow); color:inherit; text-decoration:none; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease}
a.game:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(60,120,180,.16)}
a.game:active{transform:translateY(0) scale(.99)}
a.game:focus-visible{outline:3px solid var(--accent); outline-offset:4px}
.thumb{aspect-ratio:16/10; display:grid; place-items:center; background:#F4F9FE; background-image:radial-gradient(#DDEEFB 2.4px, transparent 2.8px); background-size:22px 22px; border-bottom:1.5px solid rgba(62,149,218,.12)}
.thumb svg{height:88%; width:auto}
.body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:4px}
.title{display:flex; align-items:center; justify-content:space-between; gap:10px}
.title h2{font-family:"Jua",sans-serif; font-weight:400; font-size:24px; margin:0}
.play{flex:none; font-family:"Jua",sans-serif; font-size:15px; background:var(--accent); color:#fff; border-radius:999px; padding:5px 14px; box-shadow:0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35)}
.desc{margin:0; color:var(--ink-soft); font-size:14.5px}
.meta{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--ink-soft)}
.bar{flex:1; max-width:140px; height:7px; border-radius:7px; background:var(--accent-soft); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:7px}
.soon{background:transparent; box-shadow:none; border:2px dashed var(--line)}
.soon .thumb{background:transparent; background-image:none; border-bottom:2px dashed var(--line); color:var(--ink-soft)}
.soon .thumb span{font-family:"Jua",sans-serif; font-size:44px; opacity:.45}
.soon h2{color:var(--ink-soft)}
footer{margin-top:30px; text-align:center; font-size:13px; color:var(--ink-soft)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="satanCat" viewBox="0 0 64 64"><g fill="#2A2C33" stroke="#2A2C33" stroke-width="2.4" stroke-linejoin="round"><path d="M11 31 L12.6 7.2 Q13.2 5.4 14.8 6.6 L30.5 19 Z"/><path d="M53 31 L51.4 7.2 Q50.8 5.4 49.2 6.6 L33.5 19 Z"/></g><path d="M15.2 25 L15.9 12.8 L25.2 20.2 Z M48.8 25 L48.1 12.8 L38.8 20.2 Z" fill="#4B4F5A"/><ellipse cx="32" cy="37" rx="23.5" ry="19.5" fill="#2A2C33"/><circle cx="22.5" cy="37" r="7" fill="#FFD45C"/><circle cx="41.5" cy="37" r="7" fill="#FFD45C"/><circle cx="22.8" cy="37.8" r="5.6" fill="#121317"/><circle cx="41.8" cy="37.8" r="5.6" fill="#121317"/><circle cx="20.6" cy="35.2" r="1.9" fill="#FFFFFF"/><circle cx="39.6" cy="35.2" r="1.9" fill="#FFFFFF"/><circle cx="24.8" cy="40.2" r=".9" fill="#FFFFFF"/><circle cx="43.8" cy="40.2" r=".9" fill="#FFFFFF"/><ellipse cx="14.5" cy="45.5" rx="3.2" ry="1.9" fill="#FF8FB0" opacity=".5"/><ellipse cx="49.5" cy="45.5" rx="3.2" ry="1.9" fill="#FF8FB0" opacity=".5"/></symbol></svg>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#satanCat"/></svg>
      <h1>사탄의 장난감</h1>
    </div>
    <p class="lede">사탄이 만든 작은 장난감들. 로그인 없이 바로 놀 수 있어요.</p>
  </header>

  <main class="grid" id="grid">
    <a class="game" href="laundry/index.html">
      <div class="thumb">
        <svg viewBox="0 0 200 160" aria-hidden="true">
          <defs><clipPath id="lgDrum"><circle cx="100" cy="110" r="25"/></clipPath></defs>
          <path d="M10 26 Q100 44 190 26" fill="none" stroke="#9FB0C3" stroke-width="1.6"/>
          <g transform="translate(48 30) rotate(-4)"><rect x="-7" y="0" width="14" height="18" rx="3" fill="#FFB8C9" stroke="#4E5F73" stroke-width="1.6"/></g>
          <g transform="translate(150 30) rotate(5)"><rect x="-8" y="0" width="16" height="16" rx="3" fill="#A8E3CF" stroke="#4E5F73" stroke-width="1.6"/></g>
          <rect x="52" y="44" width="96" height="110" rx="18" fill="#CFE6F8" stroke="#6F9CC4" stroke-width="2.6"/>
          <rect x="60" y="50" width="80" height="20" rx="10" fill="#F5FAFF" stroke="#6F9CC4" stroke-width="1.8"/>
          <circle cx="72" cy="60" r="6" fill="#FFFFFF" stroke="#6F9CC4" stroke-width="1.6"/>
          <rect x="86" y="54" width="30" height="12" rx="5" fill="#3B4659"/>
          <circle cx="124" cy="60" r="3.2" fill="#3E95DA"/><circle cx="133" cy="60" r="3.2" fill="#3E95DA"/>
          <circle cx="100" cy="110" r="32" fill="#FFFFFF" stroke="#6F9CC4" stroke-width="2.6"/>
          <circle cx="100" cy="110" r="25" fill="#4A5169"/>
          <g clip-path="url(#lgDrum)">
            <path d="M80.5 117 Q76.5 106 84 98.5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round"/>
            <use href="#satanCat" x="80" y="88.4" width="40" height="40"/>
            <path d="M74 122 Q87 117 100 120 Q113 123 126 117 L126 138 L74 138 Z" fill="rgba(120,185,245,.42)"/>
            <circle cx="83" cy="121" r="3.6" fill="rgba(255,255,255,.7)"/>
            <circle cx="93.5" cy="124.5" r="2.6" fill="rgba(255,255,255,.55)"/>
            <circle cx="117" cy="119" r="3" fill="rgba(255,255,255,.65)"/>
          </g>
          <circle cx="160" cy="84" r="7" fill="rgba(255,255,255,.7)" stroke="#78A0D7" stroke-width="1.4"/>
          <circle cx="170" cy="66" r="4" fill="rgba(255,255,255,.7)" stroke="#78A0D7" stroke-width="1.2"/>
          <circle cx="34" cy="96" r="5" fill="rgba(255,255,255,.7)" stroke="#78A0D7" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="body">
        <div class="title"><h2>사탄의 세탁</h2><span class="play">하러 가기</span></div>
        <p class="desc">캐릭터를 세탁기에 돌려 보세요. 뭐가 나올지는 세탁기 마음이에요.</p>
        <div class="meta" id="laundryMeta"><span id="laundryDex">도감 0/19</span><span class="bar"><i id="laundryBar" style="width:0"></i></span></div>
      </div>
    </a>

    <a class="game" href="keycap/index.html">
      <div class="thumb">
        <svg viewBox="0 0 200 160" aria-hidden="true">
          <defs><clipPath id="kcCap"><path d="M66 92 L134 92 Q139 92 138 87 L130 51 Q129 45 123 45 L77 45 Q71 45 70 51 L62 87 Q61 92 66 92 Z"/></clipPath></defs>
          <path d="M142 112 q10 4 10 14" fill="none" stroke="#B9A6D8" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>
          <circle cx="155" cy="138" r="9" fill="none" stroke="#B9A6D8" stroke-width="3.2"/>
          <rect x="56" y="98" width="88" height="46" rx="11" fill="#F5FAFF" stroke="#9FB0C3" stroke-width="2.2"/>
          <rect x="62" y="102" width="76" height="12" rx="6" fill="#FFFFFF"/>
          <path d="M84 126 v10 M100 126 v10 M116 126 v10" stroke="#DCE6F0" stroke-width="3" stroke-linecap="round"/>
          <rect x="89" y="88" width="22" height="14" rx="3" fill="#7CB7F0" stroke="#5F97CF" stroke-width="1.6"/>
          <path d="M79 47 L82 25 L96 43 Z" fill="#FFFFFF" stroke="#9FB0C3" stroke-width="2" stroke-linejoin="round"/>
          <path d="M121 47 L118 25 L104 43 Z" fill="#FFFFFF" stroke="#9FB0C3" stroke-width="2" stroke-linejoin="round"/>
          <path d="M83 43 L84.4 31 L92 41 Z" fill="#FFC2D4"/>

            <use href="#satanCat" x="85" y="52" width="30" height="30"/>
            <g fill="#FFD34D"><path d="M78 80 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6 Z"/><path d="M123 58 l1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 2.6 -1.2 Z"/><circle cx="117" cy="84" r="1.7"/><circle cx="84" cy="60" r="1.4"/><circle cx="109" cy="87" r="1.3"/><circle cx="73" cy="70" r="1.2"/></g>
            <rect x="60" y="45" width="80" height="11" fill="rgba(255,255,255,.35)"/>
          </g>
          <path d="M66 92 L134 92 Q139 92 138 87 L130 51 Q129 45 123 45 L77 45 Q71 45 70 51 L62 87 Q61 92 66 92 Z" fill="rgba(255,182,206,.28)" stroke="#D28AA5" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M73 56 Q70 70 68 84" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round"/>
          <path d="M160 40 l2.4 5.2 5.2 2.4 -5.2 2.4 -2.4 5.2 -2.4 -5.2 -5.2 -2.4 5.2 -2.4 Z" fill="#FFD34D" stroke="#C99A2C" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M40 66 l1.8 3.8 3.8 1.8 -3.8 1.8 -1.8 3.8 -1.8 -3.8 -3.8 -1.8 3.8 -1.8 Z" fill="#FFFFFF" stroke="#9FB0C3" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="36" cy="104" r="5" fill="rgba(255,255,255,.7)" stroke="#D28AA5" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="body">
        <div class="title"><h2>사탄의 키캡</h2><span class="play">만들러 가기</span></div>
        <p class="desc">캐릭터를 넣어 나만의 키캡을 만들어 보세요. 돌려 보고, 눌러서 딸깍!</p>
      </div>
    </a>

    <div class="game soon" aria-label="준비 중인 게임">
      <div class="thumb"><span>?</span></div>
      <div class="body">
        <div class="title"><h2>다음 게임</h2></div>
        <p class="desc">준비하고 있어요. 조금만 기다려 주세요.</p>
      </div>
    </div>
  </main>

  <footer>그림과 기록은 각자 기기 안에만 저장돼요.</footer>
</div>
<script>
(function(){
  // progress from each game's own on-device record (same site, so it can be read here)
  const TOTAL=19;   // 사탄의 세탁 도감 종류 수 (히든 '사탄'은 따로) — laundry 쪽 DEX_ORDER 와 같은 값
  try{
    const raw=localStorage.getItem("choiae-laundry-dex"); const got=raw?JSON.parse(raw):[]; const arr=Array.isArray(got)?got:[];
    const n=Math.min(TOTAL,arr.filter(k=>k!=="satan").length);
    document.getElementById("laundryDex").textContent=`도감 ${n}/${TOTAL}`+(arr.includes("satan")?" + 히든":"");
    document.getElementById("laundryBar").style.width=n/TOTAL*100+"%";
  }catch(e){}
})();
</script>
</body>
</html>
